<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="bootstrap-5.3.0-alpha1-dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <title>bin9导航</title>
  <script src="bootstrap-5.3.0-alpha1-dist/js/bootstrap.bundle.min.js" defer crossorigin="anonymous"></script>
  <style>
    html {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    .header {
      background-color: #343a40;
      color: white;
      padding: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .header t {
      font-size: 28px;
      text-align: center;
    }

    .header d {
      font-size: 16px;
      text-align: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(clamp(240px, 18vw, 320px), clamp(240px, 18vw, 320px)));
      justify-content: center;
      gap: 20px;
      padding: 20px;
      flex-grow: 1;
      align-content: start;
      margin-top: 20px;
      width: 100%;
      max-width: 100% !important;
    }

    .card {
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      width: 100%;
      border-radius: 0.5rem;
      margin-bottom: 0;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
      transform: translateY(-5px);
    }

    .card-img-top {
      height: 80px;
      object-fit: cover;
      border-radius: 0.5rem 0.5rem 0 0;
    }

    .card-body {
      padding: 1.5rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 1rem;
      text-align: center;
      color: #2c3e50;
    }

    .card-text {
      font-size: 16px;
      color: #34495e;
      text-align: center;
      height: 100px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      color: white;
      font-size: 18px;
      padding: 10px 25px;
      border-radius: 4px;
      border: none;
      background-color: #007bff;
      margin-top: 1em;
      transition: background-color 0.3s ease, color 0.3s ease;
      display: inline-block;
      text-align: center;
    }

    .btn:hover {
      background-color: #0056b3;
      color: #fff;
    }

    footer {
      background-color: #2980b9;
      color: #ffffff;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      margin-top: auto;
    }

    p {
      margin-bottom: 0.5em;
      font-weight: 300;
    }

    .official-tag {
      display: inline-block;
      background-color: rgba(0, 123, 255, 0.2);
      color: var(--primary-color);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-right: 5px;
      vertical-align: middle;
    }

    .recommend-tag {
      display: inline-block;
      background-color: rgba(108, 92, 231, 0.2);
      color: #6c5ce7;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-right: 5px;
      vertical-align: middle;
    }
  </style>
</head>

<body>
  <header class="header">
    <d>使用前请阅读各网站用户服务协议 | 我是<a href="https://space.bilibili.com/23375741" target="_blank" style="color: white;">冻死企鹅</a>
    </d>
    <d>如需更多AI资源，推荐访问<a href="https://www.laogou717.com/" target="_blank" style="color: white;">神烦老狗网站</a></d>
  </header>


  <div class="container">
    <!-- 卡片将在这里渲染 -->
  </div>

  <script>
    // 渲染卡片的函数
    function renderCards(sitesData) {
      const container = document.querySelector('.container');
      if (!container) {
        console.error('未找到容器元素 .container');
        return;
      }

      // 清空容器内容（除了可能存在的其他元素，这里我们只处理卡片）
      // 为了安全起见，我们只移除具有特定类名的卡片
      const existingCards = container.querySelectorAll('.card');
      existingCards.forEach(card => card.remove());

      // 遍历网站数据并生成卡片
      sitesData.forEach(site => {
        const card = document.createElement('div');
        card.className = 'card';

        const cardBody = document.createElement('div');
        cardBody.className = 'card-body';

        const cardTitle = document.createElement('h5');
        cardTitle.className = 'card-title';

        // 处理标签
        if (site.tags.includes('recommend')) {
          const recommendTag = document.createElement('span');
          recommendTag.className = 'recommend-tag';
          recommendTag.textContent = '👍';
          cardTitle.appendChild(recommendTag);
        }

        if (site.tags.includes('official')) {
          const officialTag = document.createElement('span');
          officialTag.className = 'official-tag';
          officialTag.textContent = '官网';
          cardTitle.appendChild(officialTag);
        }

        // 添加网站标题
        const titleText = document.createTextNode(site.title);
        cardTitle.appendChild(titleText);

        const cardText = document.createElement('p');
        cardText.className = 'card-text';
        cardText.textContent = site.description;

        const cardLink = document.createElement('a');
        cardLink.href = site.link;
        cardLink.target = '_blank';
        cardLink.className = 'btn';
        cardLink.textContent = site.buttonText;

        cardBody.appendChild(cardTitle);
        cardBody.appendChild(cardText);
        cardBody.appendChild(cardLink);

        card.appendChild(cardBody);
        container.appendChild(card);
      });
    }

    // 内嵌的网站数据
    const sitesData = [
      {
        "title": "豆包",
        "tags": ["recommend", "official"],
        "description": "字节跳动推出的 AI 助手，支持对话问答、信息检索、数据分析、写代码、处理 Excel、生成 PPT 和整理文档，并提供图片、视频等内容创作能力。",
        "link": "https://www.doubao.com/chat",
        "buttonText": "免登录聊天"
      },
      {
        "title": "DeepSeek",
        "tags": ["official"],
        "description": "DeepSeek 官方 AI 助手，当前模型为 DeepSeek-V4.1 Flash，支持原生多模态视觉理解。",
        "link": "https://chat.deepseek.com/",
        "buttonText": "点击查看"
      },
      {
        "title": "QwenChat",
        "tags": ["official"],
        "description": "Qwen Studio 官方 AI 助手，支持深度思考、联网搜索、文件分析与总结、多模态理解、图片和视频生成，以及可实时预览的 HTML/SVG Artifacts。",
        "link": "https://chat.qwen.ai/",
        "buttonText": "免登录聊天"
      },
      {
        "title": "智谱Z.AI",
        "tags": ["official"],
        "description": "智谱 Z.AI 官方 AI 助手，当前旗舰模型为 GLM-5.3，主打复杂编程、长程 Agent 任务，并支持多档思考强度。",
        "link": "https://chat.z.ai/",
        "buttonText": "免登录聊天"
      },
      {
        "title": "LMArena",
        "tags": ["recommend"],
        "description": "AI 模型竞技与评测平台，可进行模型对比和人工偏好投票，覆盖文本、代码、图像生成、视频等多个 Arena，持续更新模型与排行榜。",
        "link": "https://lmarena.ai/?mode=side-by-side",
        "buttonText": "免登录聊天"
      },
      {
        "title": "在线HTML预览工具",
        "tags": [],
        "description": "无需登录即可在线编写、预览和调试 HTML，支持新窗口预览和当前页面全屏预览，适合快速验证网页代码效果。",
        "link": "./htmlPreview.html",
        "buttonText": "点击预览"
      },
      {
        "title": "Base64 编码/解码",
        "tags": [],
        "description": "在线进行文本 Base64 编码与解码，支持 UTF-8、UTF-16LE、UTF-16BE 等字符编码，数据仅在浏览器本地处理。",
        "link": "./base64.html",
        "buttonText": "点击使用"
      },
      {
        "title": "JSON 格式化",
        "tags": [],
        "description": "在线进行 JSON 格式化、校验、排序和压缩，支持本地文件处理，数据仅在浏览器本地处理。",
        "link": "./json.html",
        "buttonText": "点击使用"
      },
      {
        "title": "GUID / UUID 生成器",
        "tags": [],
        "description": "批量生成 GUID / UUID（UUID v4），支持大小写、连字符、全部复制、随机复制和下载，数据仅在浏览器本地处理。",
        "link": "./guid.html",
        "buttonText": "点击使用"
      },
      {
        "title": "密码生成器",
        "tags": [],
        "description": "生成随机安全密码，支持自定义数量、长度和字符集，支持复制、随机复制和下载，数据仅在浏览器本地处理。",
        "link": "./password.html",
        "buttonText": "点击使用"
      },
      {
        "title": "URL 编码/解码",
        "tags": [],
        "description": "原生 URL 编码解码，支持 URL 与 URL 组件处理，数据仅在浏览器本地处理。",
        "link": "./url.html",
        "buttonText": "点击使用"
      },
    ];

    // 页面加载完成后自动渲染
    window.addEventListener('load', function () {
      renderCards(sitesData);
    });
  </script>
</body>

</html>
