<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL 编码 / 解码</title>
  <link href="bootstrap-5.3.0-alpha1-dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <style>
    :root{--primary:#2563eb;--primary-light:#eff6ff;--border:#dbe3ee;--muted:#64748b;--text:#1e293b;--bg:#f5f7fb}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",Arial,sans-serif}
    .page{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:34px 0 48px}.hero{margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.02em}.hero p{margin:0;color:var(--muted);font-size:15px}
    .tool-card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.06);overflow:hidden}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--border);background:#fbfcfe}.toolbar-label{color:var(--muted);font-size:14px;margin-right:2px}.form-select{width:auto;min-width:170px;border-color:var(--border);color:var(--text);box-shadow:none!important}.form-check{margin-left:auto;color:#475569;font-size:14px}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);gap:16px;padding:18px}.panel{min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.panel-title{font-size:14px;font-weight:600;color:#334155}.counter{color:#94a3b8;font-size:12px}
    textarea{display:block;width:100%;min-height:390px;resize:vertical;padding:15px;border:1px solid var(--border);border-radius:12px;outline:none;background:#fff;color:#0f172a;font:14px/1.65 Consolas,"Cascadia Code","Microsoft YaHei",monospace;transition:border-color .2s,box-shadow .2s}textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.09)}textarea::placeholder{color:#a8b3c2}
    .middle-actions{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.icon-btn{width:44px;height:44px;border:1px solid var(--border);border-radius:12px;background:#fff;color:#475569;font-size:18px;cursor:pointer;transition:all .2s}.icon-btn:hover{color:var(--primary);border-color:#93c5fd;background:var(--primary-light)}
    .action-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 18px 18px}.btn{border-radius:9px;padding:9px 18px;font-size:14px;font-weight:500}.btn-primary{background:#3685F2;border-color:#3685F2}.btn-primary:hover{background:#2f73d9;border-color:#2f73d9}.btn-light-border{border:1px solid var(--border);background:#fff;color:#475569}.btn-light-border:hover{border-color:#93c5fd;color:var(--primary);background:var(--primary-light)}
    .tips{display:flex;gap:8px 18px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--border);background:#fafcff;color:#64748b;font-size:12px}.status{min-height:20px;margin:0 18px 14px;color:#64748b;text-align:center;font-size:13px}.status.error{color:#dc2626}.status.success{color:#059669}
    @media(max-width:800px){.page{width:min(100% - 20px,680px);padding-top:22px}.workspace{grid-template-columns:1fr}.middle-actions{flex-direction:row}.icon-btn{width:42px;height:42px}.form-check{margin-left:0;width:100%}textarea{min-height:240px}}
  </style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335023775936777"

     crossorigin="anonymous"></script>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>URL 编码 / 解码</h1>
      <p>在浏览器本地完成 URL 编码与解码，支持完整 URL、查询参数和 URL 组件的快速处理。</p>
    </header>
    <section class="tool-card">
      <div class="toolbar">
        <span class="toolbar-label">JavaScript URL 方法</span>
        <span class="toolbar-label">对应原生 encodeURI / decodeURI / encodeURIComponent / decodeURIComponent</span>
      </div>
      <div class="workspace">
        <section class="panel">
          <div class="panel-head"><span class="panel-title">输入内容</span><span class="counter" id="inputCount">0 字符</span></div>
          <textarea id="inputText" spellcheck="false" placeholder="请输入需要编码或解码的 URL、参数或文本"></textarea>
        </section>
        <div class="middle-actions"><button class="icon-btn" id="swapBtn" type="button" title="交换输入和结果" aria-label="交换输入和结果">⇄</button></div>
        <section class="panel">
          <div class="panel-head"><span class="panel-title">处理结果</span><span class="counter" id="outputCount">0 字符</span></div>
          <textarea id="outputText" spellcheck="false" readonly placeholder="处理结果将显示在这里"></textarea>
        </section>
      </div>
      <div class="action-bar">
        <button class="btn btn-primary" id="encodeUriBtn" type="button">URL 编码（encodeURI）</button>
        <button class="btn btn-primary" id="decodeUriBtn" type="button">URL 解码（decodeURI）</button>
        <button class="btn btn-primary" id="encodeComponentBtn" type="button">组件编码（encodeURIComponent）</button>
        <button class="btn btn-primary" id="decodeComponentBtn" type="button">组件解码（decodeURIComponent）</button>
        <button class="btn btn-light-border" id="copyBtn" type="button">复制结果</button>
        <button class="btn btn-light-border" id="clearBtn" type="button">清空</button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="tips"><span>✓ 所有处理均在浏览器本地完成</span><span>✓ 支持中文及多语言文本</span><span>✓ 不会上传输入内容</span></div>
    </section>
  </main>
  <script>
    const inputText=document.getElementById('inputText');
    const outputText=document.getElementById('outputText');
    const status=document.getElementById('status');
    const inputCount=document.getElementById('inputCount');
    const outputCount=document.getElementById('outputCount');
    function setStatus(message,type=''){status.textContent=message;status.className='status'+(type?' '+type:'')}
    function updateCounts(){inputCount.textContent=`${inputText.value.length} 字符`;outputCount.textContent=`${outputText.value.length} 字符`}
    function runOperation(operation){try{outputText.value=operation(inputText.value);setStatus('处理完成','success');updateCounts()}catch(error){setStatus('输入包含无效的 URL 编码','error')}}
    async function copyResult(){if(!outputText.value){setStatus('没有可复制的结果');return}try{await navigator.clipboard.writeText(outputText.value);setStatus('已复制结果','success')}catch(error){outputText.select();document.execCommand('copy');setStatus('已复制结果','success')}}
    document.getElementById('encodeUriBtn').addEventListener('click',()=>runOperation(encodeURI));
    document.getElementById('decodeUriBtn').addEventListener('click',()=>runOperation(decodeURI));
    document.getElementById('encodeComponentBtn').addEventListener('click',()=>runOperation(encodeURIComponent));
    document.getElementById('decodeComponentBtn').addEventListener('click',()=>runOperation(decodeURIComponent));
    document.getElementById('copyBtn').addEventListener('click',copyResult);
    document.getElementById('clearBtn').addEventListener('click',()=>{inputText.value='';outputText.value='';setStatus('');updateCounts();inputText.focus()});
    document.getElementById('swapBtn').addEventListener('click',()=>{const value=inputText.value;inputText.value=outputText.value;outputText.value=value;setStatus('已交换输入和结果');updateCounts()});
    inputText.addEventListener('input',updateCounts);outputText.addEventListener('input',updateCounts);
    inputText.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter'){event.preventDefault();runOperation(encodeURIComponent)}});
    updateCounts();
  </script>
</body>
</html>
